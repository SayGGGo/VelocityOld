<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Новый пароль | VELOCITY</title> <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&display=swap" rel="stylesheet"> <link rel="stylesheet" href="{{ url_for('static', filename='build/styles.css', v=1783596795) }}"> <style> body { margin: 0; padding: 0; background: #000; font-family: 'Unbounded', sans-serif; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; } </style> </head> <body> <div style="background: rgba(10, 10, 10, 0.9); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);"> <h1 style="font-size: 24px; font-weight: 900; margin-bottom: 10px;">НОВЫЙ ПАРОЛЬ</h1> <p style="font-size: 12px; color: #888; margin-bottom: 30px; line-height: 1.5;">Придумайте новый надежный пароль для вашего аккаунта.</p> {% with messages = get_flashed_messages(with_categories=true) %} {% if messages %} {% for category, message in messages %} <div style="margin-bottom: 20px; font-size: 12px; padding: 15px; border-radius: 12px; {% if category == 'success' %}background: rgba(0,255,0,0.1); color: #00ff00; border: 1px solid rgba(0,255,0,0.2);{% else %}background: rgba(255,51,51,0.1); color: #ff3333; border: 1px solid rgba(255,51,51,0.2);{% endif %}"> {{ message }} </div> {% endfor %} {% endif %} {% endwith %} <form method="POST" action="{{ url_for('reset_password_token', token=token) }}" style="text-align: left;"> <div class="input-group" style="margin-bottom: 20px;"> <label style="font-size: 10px; font-weight: 700; color: #888; margin-bottom: 8px; display: block;">ПРИДУМАЙТЕ ПАРОЛЬ</label> <input type="password" name="password" placeholder="минимум 8 символов" required minlength="8" style="width: 100%; padding: 15px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; font-size: 14px; transition: 0.3s; box-sizing: border-box;" onfocus="this.style.borderColor='#fff'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'"> </div> <button type="submit" style="width: 100%; padding: 15px; border-radius: 12px; background: #fff; color: #000; border: none; font-weight: 800; font-size: 12px; cursor: pointer; transition: 0.3s; box-sizing: border-box;" onmouseover="this.style.background='#ddd'" onmouseout="this.style.background='#fff'">СОХРАНИТЬ ПАРОЛЬ</button> </form> </div> </body> </html>
