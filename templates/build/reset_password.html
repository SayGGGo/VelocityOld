<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Сброс пароля | VELOCITY</title> <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;900&display=swap" rel="stylesheet"> <script src="https://smartcaptcha.yandexcloud.net/captcha.js?render=onload&onload=initCaptcha" defer></script> <style> body { margin: 0; padding: 0; background: #000; font-family: 'Unbounded', sans-serif; color: #fff; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; } </style> </head> <body> <div style="background: rgba(10, 10, 10, 0.9); padding: 40px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5);"> <a href="{{ url_for('auth') }}" style="display: inline-flex; align-items: center; gap: 8px; color: #aaa; text-decoration: none; font-size: 10px; font-weight: 700; margin-bottom: 30px; transition: 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='#aaa'"> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> НАЗАД КО ВХОДУ </a> <h1 style="font-size: 24px; font-weight: 900; margin-bottom: 10px;">ВОССТАНОВЛЕНИЕ ПАРОЛЯ</h1> <p style="font-size: 12px; color: #888; margin-bottom: 30px; line-height: 1.5;">Введите email, привязанный к вашему аккаунту, и мы отправим инструкции по сбросу.</p> {% with messages = get_flashed_messages(with_categories=true) %} {% if messages %} {% for category, message in messages %} <div style="margin-bottom: 20px; font-size: 12px; padding: 15px; border-radius: 12px; {% if category == 'success' %}background: rgba(0,255,0,0.1); color: #00ff00; border: 1px solid rgba(0,255,0,0.2);{% else %}background: rgba(255,51,51,0.1); color: #ff3333; border: 1px solid rgba(255,51,51,0.2);{% endif %}"> {{ message }} </div> {% endfor %} {% endif %} {% endwith %} <form method="POST" action="{{ url_for('reset_password') }}" style="text-align: left;"> <div class="input-group" style="margin-bottom: 20px;"> <label style="font-size: 10px; font-weight: 700; color: #888; margin-bottom: 8px; display: block;">ЭЛЕКТРОННАЯ ПОЧТА</label> <input type="email" name="email" placeholder="example@mail.ru" required style="width: 100%; padding: 15px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; font-size: 14px; transition: 0.3s; box-sizing: border-box;" onfocus="this.style.borderColor='#fff'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'"> </div> <div style="margin-top: 15px; margin-bottom: 20px; filter: grayscale(100%); transition: 0.4s; opacity: 0.8;" onmouseover="this.style.filter='grayscale(0%)'; this.style.opacity='1'" onmouseout="this.style.filter='grayscale(100%)'; this.style.opacity='0.8'"> <div id="reset-captcha"></div> </div> <button type="submit" style="width: 100%; padding: 15px; border-radius: 12px; background: #fff; color: #000; border: none; font-weight: 800; font-size: 12px; cursor: pointer; transition: 0.3s; box-sizing: border-box;" onmouseover="this.style.background='#ddd'" onmouseout="this.style.background='#fff'">ОТПРАВИТЬ ССЫЛКУ</button> </form> </div> <script> function initCaptcha() { if (!window.smartCaptcha) return; window.smartCaptcha.render('reset-captcha', { sitekey: '{{ YANDEX_CAPTCHA_CLIENT_KEY }}', hl: 'ru', style: { "button-color": "#ffffff", "base-error-color": "#ff3333" } }); } </script> </body> </html>
