<div id="cookie-consent" style="position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 20px 30px; border-radius: 16px; z-index: 999999; display: flex; align-items: center; gap: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-width: 90vw;"> <div style="font-size: 11px; color: #aaa; line-height: 1.5;"> Мы используем файлы cookie для улучшения работы сайта. Продолжая использовать VELOCITY, вы соглашаетесь с нашей <a href="{{ url_for('privacy') }}" style="color: #fff; text-decoration: underline;">Политикой конфиденциальности</a>. </div> <button onclick="acceptCookies()" style="background: #fff; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-size: 10px; font-weight: 800; cursor: pointer; white-space: nowrap; transition: 0.3s;" onmouseover="this.style.background='#ddd'" onmouseout="this.style.background='#fff'"> ПОНЯТНО </button> </div> <script> function acceptCookies() { localStorage.setItem('cookie_consent', 'true'); document.getElementById('cookie-consent').style.bottom = '-100px'; } document.addEventListener('DOMContentLoaded', () => { if (!localStorage.getItem('cookie_consent')) { setTimeout(() => { document.getElementById('cookie-consent').style.bottom = '20px'; }, 1500); } }); </script>
