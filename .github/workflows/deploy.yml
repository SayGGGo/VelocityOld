name: ※ Deploy | ЦТК.SPACE

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: ⁛ Start | ЦТК.SPACE
        run: |
          cat << "EOF"
          ░█████╗░████████╗██╗░░██╗
          ██╔══██╗╚══██╔══╝██║░██╔╝
          ██║░░╚═╝░░░██║░░░█████═╝░
          ██║░░██╗░░░██║░░░██╔═██╗░
          ╚█████╔╝░░░██║░░░██║░╚██╗
          ░╚════╝░░░░╚═╝░░░╚═╝░░╚═╝
          ░██████╗██████╗░░█████╗░░█████╗░███████╗
          ██╔════╝██╔══██╗██╔══██╗██╔══██╗██╔════╝
          ╚█████╗░██████╔╝███████║██║░░╚═╝█████╗░░
          ░╚═══██╗██╔═══╝░██╔══██║██║░░██╗██╔══╝░░
          ██████╔╝██║░░░░░██║░░██║╚█████╔╝███████╗
          ╚═════╝░╚═╝░░░░░╚═╝░░╚═╝░╚════╝░╚══════╝
          EOF
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 600s
          command_timeout: 10m
          script: |
            cd /root/velocity || exit
            git fetch --all
            git reset --hard origin/main
            if [ ! -d "venv" ]; then
              python3 -m venv venv || (sudo apt-get update && sudo apt-get install -y python3-venv && python3 -m venv venv)
            fi
            ./venv/bin/pip install -r requirements.txt

            
            SERVICE_FILE="/etc/systemd/system/velocity.service"
            cat << EOF | sudo tee $SERVICE_FILE
            [Unit]
            Description=Velocity Flask Application
            After=network.target

            [Service]
            User=root
            Group=www-data
            WorkingDirectory=/root/velocity
            Environment="PATH=/root/velocity/venv/bin"
            ExecStart=/root/velocity/venv/bin/python3 app.py
            Restart=always
            RestartSec=5
            StandardOutput=append:/root/velocity/app.log
            StandardError=append:/root/velocity/app.log

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable velocity
            sudo systemctl restart velocity
